
[project]
name = "arabic-llm-lab"
version = "0.1.0"
description = "An Arabic LLM research and engineering lab."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "collections>=0.1.6",
    "tokenizers>=0.23.3",
    "transformers>=5.21.1",
]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "lab"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lab --cov-report=term-missing"
